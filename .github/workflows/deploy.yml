name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ghcr.io/fl0rianfischer/morning-briefing:${{ github.sha }}
            ghcr.io/fl0rianfischer/morning-briefing:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
          # Variables (non-sensitive)
          TZ: ${{ vars.TZ }}
          CLAUDE_TOKEN_ISSUED: ${{ vars.CLAUDE_TOKEN_ISSUED }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_TO: ${{ vars.MAIL_TO }}
          BRIEFING_MODEL: ${{ vars.BRIEFING_MODEL }}
          BRIEFING_EFFORT: ${{ vars.BRIEFING_EFFORT }}
          BRIEFING_MAX_TURNS: ${{ vars.BRIEFING_MAX_TURNS }}
          BRIEFING_CRON: ${{ vars.BRIEFING_CRON }}
          # Secrets (masked)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,TZ,CLAUDE_TOKEN_ISSUED,MAIL_FROM,MAIL_TO,BRIEFING_MODEL,BRIEFING_EFFORT,BRIEFING_MAX_TURNS,BRIEFING_CRON,CLAUDE_CODE_OAUTH_TOKEN,RESEND_API_KEY
          script: |
            set -e
            cd /opt/briefing
            git pull --ff-only

            mkdir -p data/archive data/logs

            cat > .env <<ENVEOF
            IMAGE_TAG=$IMAGE_TAG
            TZ=$TZ
            CLAUDE_TOKEN_ISSUED=$CLAUDE_TOKEN_ISSUED
            MAIL_FROM=$MAIL_FROM
            MAIL_TO=$MAIL_TO
            BRIEFING_MODEL=$BRIEFING_MODEL
            BRIEFING_EFFORT=$BRIEFING_EFFORT
            BRIEFING_MAX_TURNS=$BRIEFING_MAX_TURNS
            CLAUDE_CODE_OAUTH_TOKEN=$CLAUDE_CODE_OAUTH_TOKEN
            RESEND_API_KEY=$RESEND_API_KEY
            ENVEOF
            chmod 600 .env

            docker compose pull
            docker image prune -f

            # Reinstall the cron entry on every deploy so the schedule is
            # config, not something that drifts on the box. Tagged with a
            # marker comment so replacing it is idempotent.
            #
            # CRON_TZ makes the schedule explicit: without it cron uses the
            # host timezone, and TZ in .env only affects `date` *inside* the
            # container. A UTC box would fire "0 5" at noon Jakarta with
            # nothing anywhere to explain it. CRON_TZ takes no trailing
            # comment — cron reads the rest of the line as the value — so it
            # is matched by prefix instead.
            CRON_LINE="${BRIEFING_CRON:-0 5 * * 1-5} cd /opt/briefing && /usr/bin/docker compose --profile cron run --rm briefing >> /opt/briefing/data/logs/cron.log 2>&1 # morning-briefing"
            ( crontab -l 2>/dev/null | grep -v '# morning-briefing$' | grep -v '^CRON_TZ=' || true
              echo "CRON_TZ=${TZ:-Asia/Jakarta}"
              echo "$CRON_LINE" ) | crontab -
            echo "cron installed:"
            crontab -l | grep -E '^CRON_TZ=|# morning-briefing$'

            # Belt and braces: CRON_TZ is supported by Debian/Ubuntu cron but
            # not universally, so check the host clock agrees too.
            HOST_TZ="$(timedatectl show -p Timezone --value 2>/dev/null || cat /etc/timezone 2>/dev/null || echo unknown)"
            if [ "$HOST_TZ" != "${TZ:-Asia/Jakarta}" ]; then
              echo "WARNING: host timezone is '$HOST_TZ', schedule expects '${TZ:-Asia/Jakarta}'."
              echo "WARNING: CRON_TZ should cover this, but to be certain run:"
              echo "WARNING:   sudo timedatectl set-timezone ${TZ:-Asia/Jakarta}"
            fi
