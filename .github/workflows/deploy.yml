name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ghcr.io/fl0rianfischer/morning-briefing:${{ github.sha }}
            ghcr.io/fl0rianfischer/morning-briefing:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      # The .env heredoc below writes every value unconditionally, so an unset
      # variable becomes an empty line rather than an error. That is how the
      # first working deploy shipped with MAIL_FROM blank: green build, green
      # deploy, and a briefing that was written every morning and never sent.
      # Fail here instead, where it is visible.
      - name: Check required configuration
        env:
          TZ: ${{ vars.TZ }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_TO: ${{ vars.MAIL_TO }}
          BRIEFING_HOUR: ${{ vars.BRIEFING_HOUR }}
          OPPS_HOUR: ${{ vars.OPPS_HOUR }}
          OPPS_ENABLED: ${{ vars.OPPS_ENABLED }}
          CLAUDE_TOKEN_ISSUED: ${{ vars.CLAUDE_TOKEN_ISSUED }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          missing=()
          [ -n "$TZ" ]                      || missing+=("TZ (variable)")
          [ -n "$MAIL_FROM" ]               || missing+=("MAIL_FROM (variable)")
          [ -n "$MAIL_TO" ]                 || missing+=("MAIL_TO (variable)")
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || missing+=("CLAUDE_CODE_OAUTH_TOKEN (secret)")
          [ -n "$RESEND_API_KEY" ]          || missing+=("RESEND_API_KEY (secret)")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Required configuration is empty. Settings -> Secrets and variables -> Actions."
            printf '  missing: %s\n' "${missing[@]}"
            echo "  Note that Secrets and Variables are separate tabs on that page."
            exit 1
          fi

          # A typo like Asia/Jakata is not an error anywhere downstream — it
          # just silently means UTC, and the briefing quietly shifts by hours.
          if [ ! -f "/usr/share/zoneinfo/$TZ" ]; then
            echo "::error::TZ='$TZ' is not a zone in the tz database (try Asia/Jakarta, Europe/Berlin)."
            exit 1
          fi

          for pair in "BRIEFING_HOUR:$BRIEFING_HOUR" "OPPS_HOUR:$OPPS_HOUR"; do
            name="${pair%%:*}"; value="${pair#*:}"
            if [ -n "$value" ] && ! { [ "$value" -ge 0 ] && [ "$value" -le 23 ]; } 2>/dev/null; then
              echo "::error::$name='$value' must be an hour 0-23."
              exit 1
            fi
          done

          # The two agents share one subscription's usage limits, and tick.sh
          # makes a run wait rather than overlap. Scheduling them on the same
          # hour is therefore not broken, just slower — the second one starts on
          # a later tick. Worth saying out loud rather than discovering later.
          if [ -n "$OPPS_HOUR" ] && [ "$OPPS_HOUR" = "${BRIEFING_HOUR:-5}" ]; then
            echo "::warning::OPPS_HOUR and BRIEFING_HOUR are both $OPPS_HOUR — the second agent will wait for the first and start up to 15 minutes late."
          fi

          [ -n "$CLAUDE_TOKEN_ISSUED" ] \
            || echo "::warning::CLAUDE_TOKEN_ISSUED is unset — the OAuth token expires after a year with no warning."

          echo "configuration OK — TZ=$TZ, briefing at ${BRIEFING_HOUR:-5}:00 local"
          if [ "${OPPS_ENABLED:-0}" = "1" ]; then
            echo "opportunities enabled, at ${OPPS_HOUR:-7}:00 local"
          else
            echo "opportunities present but disabled (set OPPS_ENABLED=1 to turn it on)"
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
          # Variables (non-sensitive)
          TZ: ${{ vars.TZ }}
          CLAUDE_TOKEN_ISSUED: ${{ vars.CLAUDE_TOKEN_ISSUED }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_TO: ${{ vars.MAIL_TO }}
          BRIEFING_MODEL: ${{ vars.BRIEFING_MODEL }}
          BRIEFING_EFFORT: ${{ vars.BRIEFING_EFFORT }}
          BRIEFING_MAX_TURNS: ${{ vars.BRIEFING_MAX_TURNS }}
          BRIEFING_HOUR: ${{ vars.BRIEFING_HOUR }}
          BRIEFING_DAYS: ${{ vars.BRIEFING_DAYS }}
          BRIEFING_MAX_ATTEMPTS: ${{ vars.BRIEFING_MAX_ATTEMPTS }}
          OPPS_ENABLED: ${{ vars.OPPS_ENABLED }}
          OPPS_MAIL_TO: ${{ vars.OPPS_MAIL_TO }}
          OPPS_MODEL: ${{ vars.OPPS_MODEL }}
          OPPS_EFFORT: ${{ vars.OPPS_EFFORT }}
          OPPS_MAX_TURNS: ${{ vars.OPPS_MAX_TURNS }}
          OPPS_HOUR: ${{ vars.OPPS_HOUR }}
          OPPS_DAYS: ${{ vars.OPPS_DAYS }}
          OPPS_MAX_ATTEMPTS: ${{ vars.OPPS_MAX_ATTEMPTS }}
          # Secrets (masked)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # A name missing from this list is silently absent on the box — the
          # same class of bug that once shipped a blank MAIL_FROM: green build,
          # green deploy, and a brief that never arrived. Adding a variable
          # above means adding it here and to the heredoc below.
          envs: IMAGE_TAG,TZ,CLAUDE_TOKEN_ISSUED,MAIL_FROM,MAIL_TO,BRIEFING_MODEL,BRIEFING_EFFORT,BRIEFING_MAX_TURNS,BRIEFING_HOUR,BRIEFING_DAYS,BRIEFING_MAX_ATTEMPTS,OPPS_ENABLED,OPPS_MAIL_TO,OPPS_MODEL,OPPS_EFFORT,OPPS_MAX_TURNS,OPPS_HOUR,OPPS_DAYS,OPPS_MAX_ATTEMPTS,CLAUDE_CODE_OAUTH_TOKEN,RESEND_API_KEY
          script: |
            set -e
            cd /opt/briefing
            git pull --ff-only
            chmod +x tick.sh healthcheck.sh lib/run.sh

            # One-time migration into the per-agent layout. data/archive is the
            # morning briefing's memory — each run reads its last few briefs so
            # it doesn't repeat itself — so losing it would not fail anything, it
            # would just make every morning start cold.
            #
            # A plain `mv data/archive ...` does NOT work here, and the reason is
            # not obvious: renaming a *directory* into a new parent needs write
            # permission on the directory being moved, because the kernel has to
            # update its ".." entry. data/archive is owned by the container's uid
            # 1000, not by the deploy user, so both parents being writable is not
            # enough and mv fails with EACCES. (Moving a plain file has no such
            # requirement, which is why the cron.log move below has always been
            # fine.) Hence the ladder: rename, rename as root, else copy — copy
            # needs only read on the source, and leaves the original untouched.
            #
            # This never aborts the deploy. A failure here costs one agent its
            # history; aborting costs BOTH agents their cron entries, because the
            # code is already pulled and the old crontab line no longer matches
            # the new tick.sh. Warn loudly and keep going.
            #
            # Guarded on the destination being *empty* rather than absent, so a
            # partial or failed migration is retried on the next deploy instead
            # of being silently skipped forever.
            migrate_dir() {
              src="$1"; dst="$2"
              if [ ! -d "$src" ]; then return 0; fi
              if [ -n "$(ls -A "$dst" 2>/dev/null)" ]; then return 0; fi

              mkdir -p "$(dirname "$dst")"

              if [ ! -e "$dst" ] && mv "$src" "$dst" 2>/dev/null; then
                echo "migrated $src -> $dst"
                return 0
              fi
              if [ ! -e "$dst" ] && sudo -n mv "$src" "$dst" 2>/dev/null; then
                echo "migrated $src -> $dst (as root)"
                return 0
              fi

              mkdir -p "$dst"
              if cp -a "$src/." "$dst/" 2>/dev/null \
                 || sudo -n cp -a "$src/." "$dst/" 2>/dev/null; then
                echo "migrated $src -> $dst by copy"
                echo "  $src is still there as a backup — delete it once a brief has run"
                return 0
              fi

              echo "::warning::could not migrate $src to $dst — that agent starts with no history"
              echo "WARNING: could not migrate $src to $dst. Deploy continued anyway."
              echo "WARNING: the agent will run, but with no memory of past briefs. Fix by hand:"
              echo "WARNING:   sudo mv /opt/briefing/$src /opt/briefing/$dst"
              return 0
            }

            migrate_dir data/archive data/morning-briefing/archive
            migrate_dir data/logs    data/morning-briefing/logs

            mkdir -p data/morning-briefing/archive data/morning-briefing/logs \
                     data/opportunities/archive data/opportunities/logs \
                     data/state

            cat > .env <<ENVEOF
            IMAGE_TAG=$IMAGE_TAG
            TZ=$TZ
            CLAUDE_TOKEN_ISSUED=$CLAUDE_TOKEN_ISSUED
            MAIL_FROM=$MAIL_FROM
            MAIL_TO=$MAIL_TO
            BRIEFING_MODEL=$BRIEFING_MODEL
            BRIEFING_EFFORT=$BRIEFING_EFFORT
            BRIEFING_MAX_TURNS=$BRIEFING_MAX_TURNS
            BRIEFING_HOUR=$BRIEFING_HOUR
            BRIEFING_DAYS=$BRIEFING_DAYS
            BRIEFING_MAX_ATTEMPTS=$BRIEFING_MAX_ATTEMPTS
            OPPS_ENABLED=$OPPS_ENABLED
            OPPS_MAIL_TO=$OPPS_MAIL_TO
            OPPS_MODEL=$OPPS_MODEL
            OPPS_EFFORT=$OPPS_EFFORT
            OPPS_MAX_TURNS=$OPPS_MAX_TURNS
            OPPS_HOUR=$OPPS_HOUR
            OPPS_DAYS=$OPPS_DAYS
            OPPS_MAX_ATTEMPTS=$OPPS_MAX_ATTEMPTS
            CLAUDE_CODE_OAUTH_TOKEN=$CLAUDE_CODE_OAUTH_TOKEN
            RESEND_API_KEY=$RESEND_API_KEY
            ENVEOF
            chmod 600 .env

            # --profile cron is required, not cosmetic: the only service is
            # behind that profile, and Compose hides profiled services from
            # every command that does not enable it. A plain `docker compose
            # pull` matches zero services and exits 0, so the deploy looks
            # clean while nothing is fetched — the image then gets pulled
            # lazily by the first `compose run` at 05:00, which is exactly the
            # wrong time to discover a GHCR auth problem.
            docker compose --profile cron pull
            docker image prune -f

            # cron.log is written by the host shell (the redirect below) while
            # data/logs belongs to the container's uid. Keeping it in there
            # meant one directory two different users had to write, and a
            # chown that broke cron outright. Move any old one out.
            if [ -f data/logs/cron.log ] && [ ! -f data/cron.log ]; then
              mv data/logs/cron.log data/cron.log 2>/dev/null \
                || cp data/logs/cron.log data/cron.log 2>/dev/null || true
            fi

            # One line per agent. The crontab still encodes no schedule and no
            # timezone — each line just runs tick.sh for one agent, and tick.sh
            # reads TZ and that agent's HOUR/DAYS from .env and decides.
            # CRON_TZ is gone: it is a vendor extension this box's cron
            # ignores, which is why "0 5" was firing at 05:00 Europe/Berlin and
            # landing at 10:00 in Jakarta. The host's timezone is irrelevant to
            # this project.
            #
            # Both lines are always installed. A disabled agent is disabled by
            # OPPS_ENABLED in .env, not by withholding its cron entry — so
            # turning it on is a variable change rather than a crontab edit,
            # and `tick.sh opportunities --dry-run` can explain itself either
            # way.
            #
            # The legacy '# morning-briefing' tag is stripped too: the old
            # single line called tick.sh with no agent argument, which the new
            # tick.sh rejects.
            {
              crontab -l 2>/dev/null \
                | grep -v '# briefing-agent$' \
                | grep -v '# morning-briefing$' \
                | grep -v '^CRON_TZ=' || true
              echo "*/15 * * * * /opt/briefing/tick.sh morning-briefing >> /opt/briefing/data/cron.log 2>&1 # briefing-agent"
              echo "*/15 * * * * /opt/briefing/tick.sh opportunities >> /opt/briefing/data/cron.log 2>&1 # briefing-agent"
            } | crontab -
            echo "cron installed:"
            crontab -l | grep '# briefing-agent$'

            # Bind mounts arrive with the host's ownership regardless of what
            # the image chowned, so a uid mismatch denies every write inside
            # the container — the failure that made the agent look like it was
            # producing nothing. Fix it if we can, name it exactly if we cannot.
            #
            # ONLY the per-agent trees. data/ is one mount now, but it also
            # holds data/state (attempts and locks, written by tick.sh on the
            # host) and data/cron.log (written by cron's own redirect). A
            # blanket `chown -R data` would hand those to the container's uid
            # and break cron's append — the same shape as the bug that had
            # cron.log living in data/logs.
            IMG_UID="$(docker image inspect --format '{{.Config.User}}' \
                       "ghcr.io/fl0rianfischer/morning-briefing:$IMAGE_TAG" 2>/dev/null | cut -d: -f1)"
            case "$IMG_UID" in ''|*[!0-9]*) IMG_UID=1000 ;; esac
            for d in data/morning-briefing data/opportunities; do
              CUR="$(stat -c %u "$d")"
              if [ "$CUR" != "$IMG_UID" ]; then
                chown -R "$IMG_UID:$IMG_UID" "$d" 2>/dev/null \
                  || sudo -n chown -R "$IMG_UID:$IMG_UID" "$d" 2>/dev/null \
                  || {
                    echo "WARNING: $d is owned by uid $CUR but the container runs as $IMG_UID."
                    echo "WARNING: every write inside the container will be denied. Run once:"
                    echo "WARNING:   sudo chown -R $IMG_UID:$IMG_UID /opt/briefing/data/morning-briefing /opt/briefing/data/opportunities"
                  }
              fi
            done

            # The migration above is the one step that can degrade something
            # silently, so report what each agent actually has to read. A
            # morning-briefing archive that says 0 briefs on a box that has been
            # running for weeks means the migration did not take.
            for a in morning-briefing opportunities; do
              echo "$a: $(ls -1 "data/$a/archive"/*.md 2>/dev/null | wc -l | tr -d ' ') past briefs"
            done
            if [ -d data/archive ]; then
              echo "note: the pre-migration data/archive is still on disk as a backup"
            fi

            echo "next morning-briefing: $(./tick.sh morning-briefing --dry-run | tail -1)"
            echo "next opportunities:    $(./tick.sh opportunities --dry-run | tail -1)"
