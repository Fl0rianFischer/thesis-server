name: Deploy

# The logic lives in scripts/, not here. A workflow file is the worst place to
# keep shell: it cannot be run locally, cannot be linted, and every change has
# to be tested by pushing to main. scripts/check-config.sh and
# scripts/deploy.sh are ordinary scripts you can read, `bash -n`, and run by
# hand — this file only decides when they run and what environment they get.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ghcr.io/fl0rianfischer/morning-briefing:${{ github.sha }}
            ghcr.io/fl0rianfischer/morning-briefing:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Nine values, and that is the entire configuration surface of this
      # project. Everything an agent does — its hour, its days, its model, its
      # turn budget, whether it runs at all — is a default in tick.sh and
      # lib/run.sh, versioned with the code that reads it.
      #
      # What is left here is only what genuinely cannot live in the repo: where
      # the deployment is, where mail goes, and the credentials.
      - name: Check required configuration
        env:
          TZ: ${{ vars.TZ }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_TO: ${{ vars.MAIL_TO }}
          CLAUDE_TOKEN_ISSUED: ${{ vars.CLAUDE_TOKEN_ISSUED }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FM_EMAIL: ${{ secrets.FM_EMAIL }}
          FM_PASSWORD: ${{ secrets.FM_PASSWORD }}
        run: ./scripts/check-config.sh

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
          TZ: ${{ vars.TZ }}
          CLAUDE_TOKEN_ISSUED: ${{ vars.CLAUDE_TOKEN_ISSUED }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_TO: ${{ vars.MAIL_TO }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # The freelancermap login, used only by agents/freelance-scout and
          # only once DRY_RUN is off in its config.mjs.
          FM_EMAIL: ${{ secrets.FM_EMAIL }}
          FM_PASSWORD: ${{ secrets.FM_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,TZ,CLAUDE_TOKEN_ISSUED,MAIL_FROM,MAIL_TO,CLAUDE_CODE_OAUTH_TOKEN,RESEND_API_KEY,FM_EMAIL,FM_PASSWORD
          # A bootstrap, not the deploy. `git pull` is what puts the current
          # scripts/deploy.sh on the box, so it has to happen before that file
          # can be run — which is why these three lines stay here and
          # everything else moved out.
          #
          # The exports are explicit rather than inherited: ssh-action injects
          # `envs` as assignments in this shell, and a child process only sees
          # what has been exported. Without this the deploy would write an .env
          # of empty values, which is precisely the failure the check step
          # exists to prevent.
          script: |
            set -e
            cd /opt/briefing
            git pull --ff-only
            export IMAGE_TAG TZ CLAUDE_TOKEN_ISSUED MAIL_FROM MAIL_TO
            export CLAUDE_CODE_OAUTH_TOKEN RESEND_API_KEY FM_EMAIL FM_PASSWORD
            exec bash scripts/deploy.sh
