# Lives on the box at /opt/briefing/docker-compose.yml.
# Image built in CI, pulled from GHCR by tag (IMAGE_TAG in .env, written by the
# deploy job).
#
# There is no long-running service here. The briefing is an ephemeral container
# fired once a day by host cron:
#
#   docker compose --profile cron run --rm briefing
#
# `profiles: [cron]` keeps a stray `docker compose up -d` from firing a briefing
# (and emailing you) as a side effect of poking at the box.

services:
  briefing:
    image: ghcr.io/fl0rianfischer/morning-briefing:${IMAGE_TAG:-latest}
    profiles: [cron]
    env_file: [.env]
    volumes:
      # State the agent carries between runs. archive/ is the memory: each run
      # reads the last few briefings so it doesn't repeat itself. Losing this
      # volume means every morning starts cold.
      - ./data/archive:/app/archive
      - ./data/logs:/app/logs
    restart: 'no'
    stop_grace_period: 30s
